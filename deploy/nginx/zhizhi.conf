server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /zhiliang/;
    }

    location = /zhiliang {
        return 301 /zhiliang/;
    }

    # 接口走 Java
    location /zhiliang/api/ {
        proxy_pass http://127.0.0.1:8080/zhiliang/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 前端静态页，由 zhizhi-frontend 发布到 /opt/zhizhi/web
    # 不用 try_files：和 alias 一起在 CentOS 7 的 Nginx 上容易踩坑
    location /zhiliang/ {
        alias /opt/zhizhi/web/;
        index index.html;
    }

    location /zhihe/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        error_page 502 503 504 = @zhihe_down;
    }

    location @zhihe_down {
        default_type application/json;
        return 503 '{"detail":"智合未启用"}';
    }
}
