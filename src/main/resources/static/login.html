<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 卷包过程质量数智管控一体化平台</title>
    <link rel="stylesheet" href="css/login.css?v=1.0">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">卷烟全维度质检</h1>
            <h2 class="login-subtitle">智能预警预判系统</h2>
            <p class="login-desc">浙江中烟 · 数字赋能大众赛道参赛项目</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <div class="login-error" id="loginError"></div>
            <button type="submit" class="btn-login">登 录</button>
        </form>

        <p class="login-hint">Mock演示账号：admin / 123456</p>
    </div>
</div>

<script>
(function() {
    // ========= Mock用户库 =========
    var USERS = {
        'admin':     { password: '123456', name: '管理员', role: '系统管理员' },
        'inspector': { password: '123456', name: '质检员', role: '质检操作员' },
        'zhang':     { password: '123456', name: '张工',   role: '质量工程师' }
    };

    // 已登录则直接跳转
    if (sessionStorage.getItem('qa_user')) {
        location.replace('/zhiliang/');
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var errorEl  = document.getElementById('loginError');

        if (!username || !password) {
            errorEl.textContent = '请输入用户名和密码';
            return;
        }

        var user = USERS[username];
        if (!user || user.password !== password) {
            errorEl.textContent = '用户名或密码错误';
            document.getElementById('password').value = '';
            return;
        }

        // 登录成功
        sessionStorage.setItem('qa_user', JSON.stringify({
            username: username,
            name: user.name,
            role: user.role,
            loginTime: new Date().toISOString()
        }));

        location.replace('/zhiliang/');
    });
})();
</script>

</body>
</html>
